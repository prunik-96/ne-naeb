<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Колесо Фортуны — CS2</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      background-color: #111;
      color: white;
    }
    #pointer {
      width: 0;
      height: 0;
      border-left: 20px solid transparent;
      border-right: 20px solid transparent;
      border-bottom: 30px solid yellow;
      margin: 0 auto;
    }
    #wheel {
      position: relative;
      margin: 20px auto;
      width: 300px;
      height: 300px;
      border: 10px solid #444;
      border-radius: 50%;
      background: conic-gradient(
        #1abc9c 0deg 36deg,
        #2ecc71 36deg 72deg,
        #3498db 72deg 108deg,
        #9b59b6 108deg 144deg,
        #f1c40f 144deg 180deg,
        #e67e22 180deg 216deg,
        #e74c3c 216deg 252deg,
        #34495e 252deg 288deg,
        #95a5a6 288deg 324deg,
        #f00 324deg 360deg
      );
      transition: transform 4s cubic-bezier(0.33, 1, 0.68, 1);
    }
    .segment-label {
      position: absolute;
      width: 50%;
      left: 50%;
      top: 50%;
      transform-origin: left center;
      text-align: left;
      font-size: 12px;
      color: #fff;
      pointer-events: none;
    }
    #spinButton {
      padding: 10px 20px;
      font-size: 18px;
      margin-top: 20px;
      cursor: pointer;
    }
    .prize {
      margin-top: 20px;
    }
    .prize img {
      width: 200px;
      height: auto;
    }
  </style>
</head>
<body>
  <h1>🎯 Колесо Фортуны — CS2</h1>
  <div id="pointer"></div>
  <div id="wheel"></div>
  <button id="spinButton">Крутить</button>
  <div class="prize" id="prize"></div>

  <audio id="spinSound" src="https://www.fesliyanstudios.com/play-mp3/4385" preload="auto"></audio>
  <audio id="winSound" src="https://www.fesliyanstudios.com/play-mp3/6672" preload="auto"></audio>

  <script>
    const wheel = document.getElementById("wheel");
    const prizeDiv = document.getElementById("prize");
    const spinSound = document.getElementById("spinSound");
    const winSound = document.getElementById("winSound");

    const prizes = [
      { name: "AWP | Dragon Lore", img: "https://cdn.csgoskins.gg/images/skins/awp-dragon-lore.png" },
      { name: "AK-47 | Fire Serpent", img: "https://cdn.csgoskins.gg/images/skins/ak-47-fire-serpent.png" },
      { name: "M4A4 | Howl", img: "https://cdn.csgoskins.gg/images/skins/m4a4-howl.png" },
      { name: "Butterfly Knife | Fade", img: "https://cdn.csgoskins.gg/images/skins/butterfly-fade.png" },
      { name: "Karambit | Doppler", img: "https://cdn.csgoskins.gg/images/skins/karambit-doppler.png" },
      { name: "Glove | Pandora's Box", img: "https://cdn.csgoskins.gg/images/skins/pandoras-box.png" },
      { name: "Bayonet | Marble Fade", img: "https://cdn.csgoskins.gg/images/skins/bayonet-marble-fade.png" },
      { name: "Desert Eagle | Blaze", img: "https://cdn.csgoskins.gg/images/skins/deagle-blaze.png" },
      { name: "StatTrak™ AK-47 | Neon Rider", img: "https://cdn.csgoskins.gg/images/skins/ak-47-neon-rider.png" },
      { name: "Ничего... Вы проиграли.", img: "https://cdn-icons-png.flaticon.com/512/1828/1828843.png" }
    ];

    const createLabels = () => {
      const angle = 360 / prizes.length;
      prizes.forEach((prize, index) => {
        const label = document.createElement("div");
        label.className = "segment-label";
        label.style.transform = `rotate(${index * angle}deg) translateX(10px)`;
        label.innerHTML = prize.name;
        wheel.appendChild(label);
      });
    };

    createLabels();

    let currentRotation = 0;

    document.getElementById("spinButton").addEventListener("click", () => {
      prizeDiv.innerHTML = "";
      spinSound.currentTime = 0;
      spinSound.play();

      const loseMostOfTheTime = Math.random() < 0.9;
      let selectedIndex = loseMostOfTheTime ? 9 : Math.floor(Math.random() * 9);

      const degreesPerSegment = 360 / prizes.length;
      const randomFullSpins = 5;
      const stopAngle = 360 - (degreesPerSegment * selectedIndex) - (degreesPerSegment / 2);

      currentRotation += randomFullSpins * 360 + stopAngle;

      wheel.style.transform = `rotate(${currentRotation}deg)`;

      setTimeout(() => {
        const prize = prizes[selectedIndex];
        prizeDiv.innerHTML = `<h2>${prize.name}</h2><img src="${prize.img}" alt="${prize.name}">`;
        if (selectedIndex !== 9) {
          winSound.play();
          alert(`🎉 Поздравляем! Вы выиграли: ${prize.name}`);
        }
      }, 4000);
    });
  </script>
</body>
</html>
